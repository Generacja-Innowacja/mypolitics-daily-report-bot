name: Daily Report

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC, 13:00 for Europe/Warsaw
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: node index.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          API_URL: "https://api.mypolitics.pl"
